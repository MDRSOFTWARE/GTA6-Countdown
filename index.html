<style>
:root{--pink:#ff4e9e;--peach:#ffb47a;--cyan:#8ef9e7;--ink:#10071f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Montserrat,Arial,sans-serif;color:white;background:#160b2d}.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#150d3b 0%,#59265c 32%,#d85c8c 61%,#ffb475 79%,#23142e 100%)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,215,146,.5),transparent 45%),linear-gradient(90deg,rgba(9,5,25,.65),transparent 30%,transparent 70%,rgba(9,5,25,.65));animation:breathe 12s ease-in-out infinite alternate}.sun{position:absolute;width:min(38vw,540px);aspect-ratio:1;left:50%;top:24%;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#fff0b0,#ffad76 45%,#fd5c91 85%);box-shadow:0 0 115px 40px rgba(255,137,143,.4);opacity:.9}.water{position:absolute;bottom:0;width:100%;height:27%;background:linear-gradient(180deg,#e97b9d 0%,#6c416e 24%,#160e2b 100%)}.water:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,201,166,.16) 14px 16px,transparent 17px 28px);transform:perspective(250px) rotateX(25deg);animation:water 8s linear infinite}.skyline{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 25px rgba(26,8,38,.5))}.grain{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(7,3,17,.7) 100%)}.layout{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3.4vw,56px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(13,7,30,.62);backdrop-filter:blur(14px);padding:13px 21px;font-size:clamp(11px,.9vw,16px);font-weight:800;letter-spacing:.17em;box-shadow:0 8px 30px #08031666}.live{display:flex;align-items:center;gap:11px}.dot{height:11px;width:11px;border-radius:50%;background:var(--pink);box-shadow:0 0 18px var(--pink);animation:blink 1.5s infinite}.clock{color:var(--cyan)}.center{width:100%;display:flex;align-items:center;flex-direction:column;text-align:center;transform:translateY(2%)}.eyebrow{font-size:clamp(12px,1.2vw,19px);font-weight:900;letter-spacing:.55em;text-transform:uppercase;text-shadow:0 2px 12px #13091c}.logo{display:flex;align-items:center;gap:clamp(10px,2vw,28px);margin:14px 0 6px;filter:drop-shadow(0 9px 16px #13041d)}.logo-words{text-align:right;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;font-size:clamp(50px,7.2vw,132px);line-height:.73;letter-spacing:-.055em;text-transform:uppercase;-webkit-text-stroke:1px #201025;text-shadow:4px 5px 0 #1a0a22}.logo-vi{font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(145px,19vw,345px);font-weight:900;letter-spacing:-.11em;line-height:.73;padding-right:.11em;background:linear-gradient(160deg,#ffe5bd 3%,#ff9baf 37%,#f247a1 67%,#7e51bf 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(255,226,216,.5)}.script{font-family:Pacifico,cursive;color:#ffe1c5;font-size:clamp(24px,3vw,50px);text-shadow:0 3px 15px #2b082b;transform:rotate(-5deg);margin:0 0 clamp(16px,2.5vh,30px)}.headline{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;font-weight:900;letter-spacing:.18em;font-size:clamp(18px,2.3vw,39px);text-shadow:0 4px 18px #1b0927;margin-bottom:clamp(12px,2vh,24px)}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.2vw,22px);width:min(900px,86vw)}.tile{position:relative;padding:clamp(12px,1.6vw,24px) 8px;background:linear-gradient(160deg,rgba(22,9,40,.84),rgba(46,18,58,.75));border:1px solid rgba(255,204,211,.52);border-radius:15px;box-shadow:0 16px 35px #0b041d77,inset 0 1px 0 #ffffff30;backdrop-filter:blur(15px);overflow:hidden}.tile:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ffb278,#ff4e9e,#9cf7e9)}.value{font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(48px,6.5vw,115px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.unit{color:var(--cyan);font-size:clamp(10px,1vw,15px);font-weight:900;letter-spacing:.25em;text-transform:uppercase;margin-top:5px}.released{display:none;font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(38px,6vw,110px);font-weight:900;color:#b4fff0;text-shadow:0 0 35px #00e9c3,0 5px 20px #1d052d}.footer{display:flex;justify-content:center;align-items:center;text-align:center;gap:12px}.foot-label{background:rgba(13,7,30,.7);border:1px solid #ffffff44;padding:14px 28px;border-radius:10px;font-weight:800;font-size:clamp(10px,1.05vw,17px);letter-spacing:.15em;text-transform:uppercase;backdrop-filter:blur(12px)}.foot-label strong{color:#ffc294}@keyframes blink{50%{opacity:.25}}@keyframes breathe{to{filter:hue-rotate(7deg) brightness(1.1)}}@keyframes water{to{background-position:0 80px}}@media(max-width:650px){.layout{padding:16px}.pill{padding:10px;font-size:10px;letter-spacing:.05em}.logo-words{font-size:12vw}.logo-vi{font-size:30vw}.countdown{width:100%;gap:6px}.tile{border-radius:9px}.value{font-size:12vw}.unit{font-size:9px;letter-spacing:.06em}.eyebrow{letter-spacing:.2em}.foot-label{padding:10px}}@media(max-height:700px){.logo{margin:4px}.logo-vi{font-size:min(24vh,19vw)}.logo-words{font-size:min(10vh,7.2vw)}.script{margin-bottom:8px}.tile{padding:9px}.value{font-size:min(12vh,6.5vw)}.headline{margin-bottom:8px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
</head>
<body>

<!-- palm silhouettes, intentionally framing the content -->
<g fill="none" stroke="#10091e" stroke-linecap="round"><path d="M110 1110Q210 740 290 385" stroke-width="34"/><path d="M1840 1110Q1740 730 1670 365" stroke-width="34"/></g>
<g fill="#10091e"><g transform="translate(290 385)"><path d="M0 0Q-180-100-285 12Q-135-36 0 0Z"/><path d="M0 0Q-130-170-260-120Q-110-95 0 0Z"/><path d="M0 0Q-50-180-155-210Q-35-130 0 0Z"/><path d="M0 0Q100-165 235-145Q85-100 0 0Z"/><path d="M0 0Q205-70 260 70Q120-30 0 0Z"/><path d="M0 0Q80 80 95 230Q25 80 0 0Z"/><path d="M0 0Q-90 60-125 185Q-20 65 0 0Z"/></g><g transform="translate(1670 365) scale(-1 1)"><path d="M0 0Q-180-100-285 12Q-135-36 0 0Z"/><path d="M0 0Q-130-170-260-120Q-110-95 0 0Z"/><path d="M0 0Q-50-180-155-210Q-35-130 0 0Z"/><path d="M0 0Q100-165 235-145Q85-100 0 0Z"/><path d="M0 0Q205-70 260 70Q120-30 0 0Z"/><path d="M0 0Q80 80 95 230Q25 80 0 0Z"/><path d="M0 0Q-90 60-125 185Q-20 65 0 0Z"/></g></g></svg><div class="grain"></div></div>
<main class="layout"><header class="top"><div class="pill live"><span class="dot"></span> Waiting room live</div><div class="pill clock" id="nz-clock">Auckland · --:--:--</div></header>
<section class="center" aria-label="GTA VI countdown"><div class="eyebrow">The wait is almost over</div><div class="logo"><div class="logo-words">Grand<br>Theft<br>Auto</div><div class="logo-vi">VI</div></div><div class="script">Welcome to Leonida</div><div class="headline" id="headline">Countdown to midnight</div><div class="countdown" id="countdown"><div class="tile"><div class="value" id="days">00</div><div class="unit">Days</div></div><div class="tile"><div class="value" id="hours">00</div><div class="unit">Hours</div></div><div class="tile"><div class="value" id="minutes">00</div><div class="unit">Minutes</div></div><div class="tile"><div class="value" id="seconds">00</div><div class="unit">Seconds</div></div></div><div class="released" id="released" role="status">Countdown complete!</div></section>
<footer class="footer"><div class="foot-label" id="footer-text">NZ countdown target <strong>· 19 Nov 2026 · 12:00 AM NZDT</strong></div></footer></main>
<script>
'use strict';
// Edit this ISO 8601 date to change the target. The +13:00 offset is NZ daylight time.
// This is a CUSTOM countdown target, not a claim about the official game's release.
const COUNTDOWN_TARGET = '2026-11-19T00:00:00+13:00';
const targetMs = Date.parse(COUNTDOWN_TARGET);
const ids = Object.fromEntries(['days','hours','minutes','seconds','nz-clock','countdown','released','headline','footer-text'].map(id=>[id,document.getElementById(id)]));
const formatter = new Intl.DateTimeFormat('en-NZ',{timeZone:'Pacific/Auckland',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZoneName:'short'});
const pad = n=>String(n).padStart(2,'0');
function tick(){
 const now=Date.now();
 ids['nz-clock'].textContent='Auckland · '+formatter.format(new Date(now));
 if(!Number.isFinite(targetMs)){ids.headline.textContent='Invalid countdown date';return;}
 const remaining=Math.max(0,targetMs-now);
 const totalSeconds=Math.ceil(remaining/1000);
 const days=Math.floor(totalSeconds/86400),hours=Math.floor(totalSeconds%86400/3600),minutes=Math.floor(totalSeconds%3600/60),seconds=totalSeconds%60;
 ids.days.textContent=pad(days);ids.hours.textContent=pad(hours);ids.minutes.textContent=pad(minutes);ids.seconds.textContent=pad(seconds);
 if(remaining<=0){ids.countdown.style.display='none';ids.released.style.display='block';ids.headline.textContent='The countdown has ended';ids['footer-text'].textContent='New Zealand countdown target reached';}
}
tick();setInterval(tick,250);
</script>
