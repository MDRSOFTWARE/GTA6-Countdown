<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17091c"><title>GTA VI | Leonida Countdown</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--pink:#ff65ac;--cyan:#8ffcf0;--gold:#ffd2a1;--text:#fff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#140a21;color:var(--text);font-family:Montserrat,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 65% 40%,#a62b69 0%,#45225b 45%,#100b25 100%)}.slide{position:absolute;inset:-7%;opacity:0;transition:opacity 2.8s ease;will-change:opacity;overflow:hidden}.slide.active{opacity:1}.slide-image{position:absolute;inset:0;background-position:center;background-size:cover;transform:scale(1.12);will-change:transform;animation:drift 24s ease-in-out infinite alternate}.slide:nth-child(even) .slide-image{animation-direction:alternate-reverse}.slide-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,22,.17),rgba(15,8,25,.32))}@keyframes drift{0%{transform:scale(1.15) translate3d(-1.7%,.8%,0) rotate(-.3deg)}100%{transform:scale(1.22) translate3d(1.7%,-1.3%,0) rotate(.35deg)}}.scenery{position:absolute;inset:0;pointer-events:none;z-index:2;transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform 2s ease}.sun{position:absolute;width:min(39vw,580px);aspect-ratio:1;border-radius:50%;left:63%;top:17%;background:linear-gradient(#ffe6a5,#ff9b84 58%,#f94b99);opacity:.43;filter:blur(7px);box-shadow:0 0 100px #fc7ba870}.horizon{position:absolute;bottom:0;left:0;right:0;height:36%;background:linear-gradient(transparent,#140819bb)}.palm{position:absolute;bottom:-9%;height:70%;width:27%;opacity:.48;filter:drop-shadow(0 0 8px #0d0822)}.palm.left{left:-4%;transform:rotate(-8deg)}.palm.right{right:-4%;transform:scaleX(-1) rotate(-7deg)}.wash{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 45%,rgba(9,5,18,.1),rgba(8,5,19,.57) 77%,rgba(5,3,13,.86)),linear-gradient(90deg,rgba(8,5,18,.47),transparent 28%,transparent 72%,rgba(8,5,18,.47));pointer-events:none}.grain{position:absolute;inset:0;z-index:4;opacity:.09;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg viewBox=%220 0 180 180%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.7%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E')}.hud{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 5vw;text-align:center}.topbar{position:absolute;top:4.2%;left:4.5%;right:4.5%;display:flex;justify-content:space-between;align-items:center;gap:14px}.pill{border:1px solid #ffffff65;background:#0b0926a6;backdrop-filter:blur(12px);padding:11px 18px;border-radius:99px;letter-spacing:.15em;font-weight:800;font-size:clamp(10px,1vw,15px);box-shadow:0 7px 26px #0005}.live{color:#ff9ac9}.dot{display:inline-block;width:9px;height:9px;background:#ff3e83;border-radius:50%;margin-right:9px;box-shadow:0 0 14px #ff3e83;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.3}}.clock{color:#bafff3}.title{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:900;font-size:clamp(42px,7.5vw,135px);letter-spacing:.09em;line-height:.86;text-shadow:0 8px 26px #0b0619,0 0 38px #ff60a344}.roman{font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(115px,17vw,300px);font-weight:900;letter-spacing:-.04em;line-height:.78;background:linear-gradient(#fff3e4 7%,#ffb3d0 42%,#ff5d9b 74%,#b268d4);color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 12px 18px #1a082c)}.eyebrow{font-size:clamp(12px,1.3vw,20px);font-weight:800;letter-spacing:.48em;color:#ffdae9;text-shadow:0 2px 12px #000;margin:12px 0 26px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.6vw,26px);width:min(900px,90vw)}.tile{border-radius:18px;border:1px solid #ffbadf99;background:linear-gradient(145deg,#27102cc9,#100c29c9);backdrop-filter:blur(14px);padding:clamp(12px,1.8vw,26px) 6px;box-shadow:inset 0 1px #ffffff40,0 16px 40px #0007;position:relative;overflow:hidden}.tile:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#91f4e8,#ff74ae,#ffce99)}.num{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(45px,6.7vw,112px);line-height:1}.lbl{color:#aaf7ef;font-size:clamp(9px,.95vw,14px);font-weight:800;letter-spacing:.2em;margin-top:7px}.footer{position:absolute;bottom:4.2%;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(10px,1vw,15px);font-weight:800;letter-spacing:.13em;text-shadow:0 2px 8px #000}.footer .date{color:#ffe2bb}.footer .slidecount{color:#c3fff4}.released{display:none;font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(48px,7vw,110px);font-weight:900;color:#baffef;text-shadow:0 0 35px #ff65ac}.stage.done .countdown{display:none}.stage.done .released{display:block}.notice{position:absolute;bottom:10%;font-size:12px;color:#ffe6d6c9;letter-spacing:.1em}@media(max-width:680px){.topbar{top:3%;left:3%;right:3%}.pill{padding:9px 10px;letter-spacing:.05em}.eyebrow{letter-spacing:.2em}.countdown{width:96vw}.footer{flex-direction:column;bottom:2.5%}.tile{border-radius:10px}.hud{padding:5vh 2vw}}@media(prefers-reduced-motion:reduce){.slide-image,.dot{animation:none}.slide{transition:none}}

(()=>{'use strict';const cfg=window.GTA_CONFIG||{};const $=id=>document.getElementById(id);const stage=$('stage'),slides=$('slides'),scene=$('scenery');const backgrounds=Array.isArray(cfg.backgrounds)?cfg.backgrounds.filter(x=>typeof x==='string'&&x.trim()).slice(0,10):[];const demo=['linear-gradient(130deg,#121b45 4%,#d24c91 54%,#fbb477 100%)','linear-gradient(155deg,#170f37 5%,#7a3c9b 50%,#ef8e8b 100%)','linear-gradient(120deg,#1d1847 10%,#2b8e9d 52%,#ff8c8a 100%)','linear-gradient(155deg,#0c1436 10%,#ad4078 54%,#e9ad7b 100%)','linear-gradient(135deg,#14153b 8%,#b85f83 54%,#f4c3a0 100%)','linear-gradient(135deg,#101d37 8%,#4d528e 54%,#ec9c85 100%)','linear-gradient(145deg,#161238 5%,#b44a99 55%,#f7aa7b 100%)','linear-gradient(120deg,#121c3c 10%,#567a9b 52%,#e68c9e 100%)','linear-gradient(145deg,#1b0d36 10%,#98477b 55%,#f7bb8b 100%)','linear-gradient(135deg,#0c2035 5%,#c25b87 55%,#f3a887 100%)'];const items=backgrounds.length?backgrounds:demo;const nodes=items.map((src,i)=>{const slide=document.createElement('div');slide.className='slide'+(i===0?' active':'');const layer=document.createElement('div');layer.className='slide-image';if(backgrounds.length){const safe=src.replace(/["\\\n\r]/g,'');layer.style.backgroundImage=`url("${safe}")`;layer.style.backgroundColor='#442348'}else layer.style.backgroundImage=src;slide.appendChild(layer);slides.appendChild(slide);return slide});let active=0;const interval=Math.max(5,Number(cfg.slideSeconds)||20)*1000;function switchSlide(){nodes[active].classList.remove('active');active=(active+1)%nodes.length;nodes[active].classList.add('active');$('slideLabel').textContent=`SCENE ${String(active+1).padStart(2,'0')} / ${String(nodes.length).padStart(2,'0')}`}setInterval(switchSlide,interval);let t0=performance.now();function animate(){const t=(performance.now()-t0)/1000;scene.style.setProperty('--px',`${Math.sin(t*.12)*13}px`);scene.style.setProperty('--py',`${Math.cos(t*.09)*8}px`);requestAnimationFrame(animate)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)animate();const target=new Date(cfg.targetISO||'2026-11-19T00:00:00+13:00').getTime();const valid=Number.isFinite(target);const zone='Pacific/Auckland';const dateFormat=new Intl.DateTimeFormat('en-NZ',{timeZone:zone,day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'});$('launchLabel').textContent=valid?`TARGET · ${dateFormat.format(new Date(target)).toUpperCase()}`:'INVALID COUNTDOWN DATE';const clockFormat=new Intl.DateTimeFormat('en-NZ',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZoneName:'short'});function update(){const now=Date.now();$('nzClock').textContent='AUCKLAND · '+clockFormat.format(new Date(now));if(!valid)return;let left=Math.max(0,target-now);if(left===0)stage.classList.add('done');const d=Math.floor(left/86400000);left%=86400000;const h=Math.floor(left/3600000);left%=3600000;const m=Math.floor(left/60000);left%=60000;const s=Math.floor(left/1000);for(const [id,val] of [['days',d],['hours',h],['minutes',m],['seconds',s]])$(id).textContent=String(val).padStart(2,'0')}update();setInterval(update,250)})();
</script></body></html>
